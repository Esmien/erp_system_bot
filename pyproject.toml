[project]
name = "erp-system-bot"
version = "0.1.0"
description = "TG-bot for ERP system"
authors = [
    { name = "Владислав Сороковых", email = "black.walf16@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12, <3.15"
dependencies = [
    "aiogram (>=3.29.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi (>=0.138.1,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "redis (>=8.0.1,<9.0.0)",
]

[tool.poetry]
packages = [
    { include = "bot", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

[tool.ruff]
# Фиксируем версию Python для правильных подсказок
target-version = "py312"

exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pypackages__",
    "alembic",
    "migrations"
]

line-length = 120

[tool.ruff.lint]
select = [
    "E", # Стандартные ошибки PEP8 (pycodestyle)
    "F", # Логические ошибки, неиспользуемые переменные (Pyflakes)
    "I", # Автоматическая сортировка импортов (isort)
    "UP", # Автоматический апгрейд синтаксиса до Python 3.12 (pyupgrade)
    "B", # Поиск неочевидных багов, например, mutable defaults (flake8-bugbear)
    "C4", # Улучшение работы со списками и словарями (flake8-comprehensions)
    "SIM", # Советы по упрощению логики кода (flake8-simplify)
]

# Какие правила игнорировать (обычно это конфликтующие с форматтером вещи)
ignore = [
    "B008", # Разрешаем вызовы функций в аргументах
]

[tool.ruff.format]
# Настройки форматтера
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Группировка импортов, чтобы всё было красиво
known-first-party = ["bot"] # Основной модуль будет отделен пустой строкой

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=bot --cov-report=term-missing"
